x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'
    compress: 'true'

x-frontend-environment: &frontend-environment
  HOSTNAME: 0.0.0.0
  DATABASE_URL: postgresql://comp:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/comp
  PRISMA_DISABLE_TLS: '1'
  SECRET_KEY: ${SERVICE_HEX_64_AUTH}
  AUTH_SECRET: ${SERVICE_HEX_64_AUTH}
  BETTER_AUTH_SECRET: ${SERVICE_HEX_64_AUTH}
  INTERNAL_API_TOKEN: ${SERVICE_HEX_64_INTERNAL}
  REVALIDATION_SECRET: ${SERVICE_HEX_64_INTERNAL}
  BETTER_AUTH_URL: https://trycomp-api.yumait.au
  NEXT_PUBLIC_BETTER_AUTH_URL: https://trycomp-api.yumait.au
  NEXT_PUBLIC_API_URL: https://trycomp-api.yumait.au
  NEXT_PUBLIC_PORTAL_URL: https://trycomp-portal.yumait.au
  AUTH_TRUSTED_ORIGINS: https://trycomp-app.yumait.au,https://trycomp-portal.yumait.au,https://trycomp-api.yumait.au
  UPSTASH_REDIS_REST_URL: http://redis-http:80
  UPSTASH_REDIS_REST_TOKEN: ${SERVICE_HEX_64_REDIS_REST}
  APP_AWS_REGION: ${APP_AWS_REGION:-ap-southeast-2}
  APP_AWS_ACCESS_KEY_ID: ${APP_AWS_ACCESS_KEY_ID:-}
  APP_AWS_SECRET_ACCESS_KEY: ${APP_AWS_SECRET_ACCESS_KEY:-}
  APP_AWS_BUCKET_NAME: ${APP_AWS_BUCKET_NAME:-}
  APP_AWS_QUESTIONNAIRE_UPLOAD_BUCKET: ${APP_AWS_BUCKET_NAME:-}
  APP_AWS_KNOWLEDGE_BASE_BUCKET: ${APP_AWS_BUCKET_NAME:-}
  APP_AWS_ORG_ASSETS_BUCKET: ${APP_AWS_BUCKET_NAME:-}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        NEXT_PUBLIC_BETTER_AUTH_URL: https://trycomp-api.yumait.au
        NEXT_PUBLIC_PORTAL_URL: https://trycomp-portal.yumait.au
        NEXT_PUBLIC_API_URL: https://trycomp-api.yumait.au
    ports:
      - '127.0.0.1:3100:3000'
    environment: *frontend-environment
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - default
      - legacy
    logging: *default-logging

  portal:
    build:
      context: .
      dockerfile: Dockerfile
      target: portal
      args:
        NEXT_PUBLIC_BETTER_AUTH_URL: https://trycomp-api.yumait.au
        NEXT_PUBLIC_API_URL: https://trycomp-api.yumait.au
    ports:
      - '127.0.0.1:3102:3000'
    environment: *frontend-environment
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - default
      - legacy
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${SERVICE_PASSWORD_64_REDIS}
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_64_REDIS}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  redis-http:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SERVICE_HEX_64_REDIS_REST}
      SRH_CONNECTION_STRING: redis://:${SERVICE_PASSWORD_64_REDIS}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.multistage
      target: production
    ports:
      - '127.0.0.1:3333:3333'
    environment:
      DATABASE_URL: postgresql://comp:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/comp
      PRISMA_DISABLE_TLS: '1'
      SECRET_KEY: ${SERVICE_HEX_64_AUTH}
      INTERNAL_API_TOKEN: ${SERVICE_HEX_64_INTERNAL}
      MACED_API_KEY: mc_dev_${SERVICE_HEX_64_MACED}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_DEFAULT: ${RESEND_FROM_DEFAULT:-}
      RESEND_FROM_SYSTEM: ${RESEND_FROM_SYSTEM:-}
      BASE_URL: https://trycomp-api.yumait.au
      TRUST_APP_URL: https://trycomp-portal.yumait.au
      NEXT_PUBLIC_APP_URL: https://trycomp-app.yumait.au
      NEXT_PUBLIC_PORTAL_URL: https://trycomp-portal.yumait.au
      AUTH_TRUSTED_ORIGINS: https://trycomp-app.yumait.au,https://trycomp-portal.yumait.au,https://trycomp-api.yumait.au
      UPSTASH_REDIS_REST_URL: http://redis-http:80
      UPSTASH_REDIS_REST_TOKEN: ${SERVICE_HEX_64_REDIS_REST}
      APP_AWS_REGION: ${APP_AWS_REGION:-ap-southeast-2}
      APP_AWS_ACCESS_KEY_ID: ${APP_AWS_ACCESS_KEY_ID:-}
      APP_AWS_SECRET_ACCESS_KEY: ${APP_AWS_SECRET_ACCESS_KEY:-}
      APP_AWS_BUCKET_NAME: ${APP_AWS_BUCKET_NAME:-}
      APP_AWS_QUESTIONNAIRE_UPLOAD_BUCKET: ${APP_AWS_BUCKET_NAME:-}
      APP_AWS_KNOWLEDGE_BASE_BUCKET: ${APP_AWS_BUCKET_NAME:-}
      APP_AWS_ORG_ASSETS_BUCKET: ${APP_AWS_BUCKET_NAME:-}
      AWS_SES_FROM_DEFAULT: ${AWS_SES_FROM_DEFAULT:-}
      PORT: 3333
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:3333/v1/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default
      - legacy
    logging: *default-logging

networks:
  legacy:
    external: true
    name: comp_default

volumes:
  redis-data:
